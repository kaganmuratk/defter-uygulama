# Defter — yerel iPad/iPhone uygulaması (SwiftUI + PDFKit + PencilKit).
# Xcode projesi depoda tutulmaz; CI `xcodegen generate` ile üretir (.github/workflows/yerel.yml).
name: Defter
options:
  bundleIdPrefix: com.kagan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Defter:
    type: application
    platform: iOS
    sources:
      - path: Defter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagan.fizyoloji
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Defter/Info.plist
    info:
      path: Defter/Info.plist
      properties:
        CFBundleDisplayName: Defter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIAppFonts:
          - Literata.ttf
          - PlusJakartaSans.ttf
        ITSAppUsesNonExemptEncryption: false
  DefterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DefterUITests
    dependencies:
      - target: Defter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagan.fizyoloji.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Defter:
    build:
      targets:
        Defter: all
        DefterUITests: [test]
    test:
      targets:
        - DefterUITests
